[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "careflow"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "fastembed>=0.7",
    "litellm==1.106.7",
    "psycopg[binary]>=3.2",
    "pydantic>=2",
    "python-dotenv",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx", "pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"src/careflow/agents/intake_prompt.py" = ["E501"]
"src/careflow/agents/baseline_prompt.py" = ["E501"]
"src/careflow/memory/prompts.py" = ["E501"]
